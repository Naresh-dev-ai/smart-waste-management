services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waste_db
      POSTGRES_USER: waste_user
      POSTGRES_PASSWORD: waste_password
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d waste_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
